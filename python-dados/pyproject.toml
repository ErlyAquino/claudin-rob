[project]
name = "python-dados"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erly J. C. Aquino", email = "fisicaerly@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dash>=4.4.1",
    "fastapi>=0.141.1",
    "influxdb-client>=1.50.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyserial>=3.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
python-dados = "python_dados:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
